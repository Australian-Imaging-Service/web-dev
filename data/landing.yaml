# Hugo merges the theme's demo landing data into ours, so disable its sections
hero: { enable: false }
featureGrid: { enable: false }
imageCompare: { enable: false }

aisHero:
  enable: true
  weight: 10
  template: ais hero
  backgroundImage: images/main/main_1.png
  titleLines:
    - "Unlocking Insights"
    - "Shaping Discoveries"
  subtitle: A national federation for securely managing and analysing imaging data.

audience:
  enable: true
  weight: 20
  template: ais audience
  title: Built by the Australian research community
  items:
    - title: Researchers
      description: Improve your research at scale.
      accent: blue
    - title: Facility Staff
      description: Streamline facility operations with automated data capture, QA, reporting.
      accent: green
    - title: Hospital & Ethics Committee
      description: Improve privacy, security, and governance over your research participant data.
      accent: purple

capabilities:
  enable: true
  weight: 30
  template: ais capabilities
  title: Easy, secure, and powerful
  subtitle: We aim to increase research reproducibility and drive the adoption of innovative but trusted analysis techniques.
  items:
    - title: Data Capture & Movement
      description: Automatically capture, de-identify, and route data from connected sites to your repository.
      url: /features/data_management/
      image: images/main/bottom_bg.jpg
      width: narrow
    - title: Data Management & Curation
      description: Store, annotate, share, and archive large datasets.
      url: /features/data_management/
      width: wide
    - title: Analysis Workflows & Pipelines
      description: Build and lock down your analysis with scalable and extendable workflow engine for high confidence in your results.
      url: /features/automated_pipelines/
      width: wide
    - title: Interactive Analysis & Visualization
      description: On-demand analysis environments pre-loaded with imaging software.
      url: /features/interactive_analysis/
      image: images/main/interactive_analysis.jpg
      width: narrow
    - title: Machine Learning
      description: On-demand inference with international model zoo & sovereign model training.
      url: /features/machine_learning/
      image: images/main/automated_pipelines.jpg
      width: narrow
    - title: Data Publishing & Discovery
      description: Mint DOIs for your datasets and publish metadata in national discovery portal to find new collaborations.
      width: wide

selectedWork:
  enable: true
  weight: 40
  template: ais selected work
  title: Our selected work
  items:
    - title: Transforming Clinical Image Management and Analysis
      description: The Australian Imaging Service is enhancing imaging research on a global scale and making it more secure and easier.
      image: images/main/work1.png
    - title: Building research capacity towards early detection of melanoma
      description: 45,000 avatars to develop next-generation skin cancer diagnosis.
      image: images/main/work2.png
    - title: Interstitial Lung Disease Registry
      description: The ILD Registry provides a platform for consistency and continuity in data collection for patients with ILD.
      image: images/main/work3.png

partners:
  enable: true
  weight: 50
  template: ais logo grid
  title: We drive national collaboration
  subtitle: We partner with leading imaging research institutions across Australia.
  items:
    - { title: University of Sydney, image: images/main/partner_logos/usyd.svg }
    - { title: National Imaging Facility, image: images/main/partner_logos/NIF-LOGO-REVERSE.svg }
    - { title: Australian Access Federation, image: images/main/partner_logos/aaf.svg }
    - { title: QCIF, image: images/main/partner_logos/qcif.svg }
    - { title: UNSW, image: images/main/partner_logos/unsw.svg }
    - { title: The University of Queensland, image: images/main/partner_logos/uq.svg }
    - { title: Monash University, image: images/main/partner_logos/monash.svg }
    - { title: Macquarie University, image: images/main/partner_logos/mqu.svg }
    - { title: The University of Western Australia, image: images/main/partner_logos/uwa.svg }
    - { title: QUT, image: images/main/partner_logos/qut.svg }

join:
  enable: true
  weight: 60
  template: ais cta
  title: Join AIS today
  subtitle: Connect with your nearest AIS node to get access, support, and onboarding.
  button:
    text: Find your node
    url: /support/find_your_node/
