baseURL: /
languageCode: en-us
title: Australian Imaging Service
caches:
  images:
    dir: :cacheDir/images

ignoreFiles:
  - "themes/.*/content/posts/.*"
security:
  allowContent:
    - '! ^text/org$'

build:
  noJSConfigInAssets: true

module:
  hugoVersion:
    extended: true
    min: "0.114.0"
  imports:
    - path: "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
      disable: false
    - path: "github.com/Australian-Imaging-Service/charts"
      disabled: false
      mounts:
        - source: docs/Deployment
          target: "content/docs/Deployment"
        - source: docs/Development
          target: "content/docs/Development"
        - source: docs/Operations
          target: "content/docs/Operations"
        - source: docs/Policy
          target: "content/docs/Policy"
        - source: docs/howto
          target: "content/docs/How To"
    - path: "github.com/Australian-Imaging-Service/pipelines"
      disabled: false
      mounts:
        - source: docs
          target: "content/docs/facilities"

markup:
  tableOfContents:
    endLevel: 3
    startLevel: 1
  goldmark:
    renderer:
      unsafe: true # https://jdhao.github.io/2019/12/29/hugo_html_not_shown/
  goldmark.parser:
    parser.attribute:
      block: true

theme:
  - lotusdocs

params:
  moto: "A national federation for securely managing and analysing imaging data."
  description: ""
  about:
    section1:
      image: 'images/main/pages/federation.png'
      title: 'Federated model'
      description:
        - title: 'Edge Devices'
          description: 'Upload & process data from clinical sites and imaging facilities.'
        - title: 'Nodes'
          description: 'Linked data repositories with a shared library of containerized pipelines and analysis tools deployed on Kubernetes.'
        - title: 'Data Portal'
          description: 'Open frontend for findable metadata (opt-in).'
    funded_by:
      - title: 'Australian Research Data Commons'
        featured_image: 'images/main/partner_logos/ARDC.svg'
      - title: 'National Imaging Facility'
        featured_image: 'images/main/partner_logos/NIF-LOGO-REVERSE.svg'
      - title: 'Funded by the European Union'
        featured_image: 'images/main/partner_logos/FundedbytheEU.svg'
      - title: 'Medical Research Future Fund'
        featured_image: 'images/main/partner_logos/mrff.svg'

  google_fonts: [
    ["Inter", "300, 400, 600, 700"],
    ["Fira Code", "500, 700"]
  ]

  sans_serif_font: "Inter"     # Default is System font
  secondary_font: "Inter"     # Default is System font
  mono_font: "Fira Code" # Default is System font

  navCta:
    text: Find your node
    url: /support/find_your_node/
  tagline: Your trustworthy imaging partner for research excellence.
  footer:
    copyright: "© 2026 Australian Imaging Service. All rights reserved."
    # version: true # includes git commit info

  social:
    #github: "https://github.com/Australian-Imaging-Service"        # YOUR_GITHUB_ID or YOUR_GITHUB_URL
    github: "Australian-Imaging-Service"        # YOUR_GITHUB_ID or YOUR_GITHUB_URL
    # twitter: ""       # YOUR_TWITTER_ID
    # instagram: "colinwilson"     # YOUR_INSTAGRAM_ID
    # rss: true                    # show rss icon with link

  docs: # Parameters for the /docs 'template'
    title          : "Documentation"           # default html title for documentation pages/sections
    darkMode       : true                                # enable dark mode option? default false

    prism          : true                                # enable syntax highlighting via Prism

    prismTheme     : "solarized-light"                           # (optional) - Set theme for PrismJS. Options include: lotusdocs (default), solarized-light, twilight, lucario

    # gitinfo
    repoURL        : "https://github.com/colinwilson/lotusdocs.dev"  # Git repository URL for your site [support for GitHub, GitLab, and BitBucket]
    repoBranch     : "release"
    editPage       : true                                # enable 'Edit this page' feature - default false
    lastMod        : true                                # enable 'Last modified' date on pages - default false
    lastModRelative: true                                # format 'Last modified' time as relative - default true

    sidebarIcons   : true                                # enable sidebar icons? default false
    breadcrumbs    : true                                # default is true
    backToTop      : true                                # enable back-to-top button? default true

    # ToC
    toc            : true                                # enable table of contents? default is true
    tocMobile      : true                                # enable table of contents in mobile view? default is true
    scrollSpy      : true                                # enable scrollspy on ToC? default is true

    # front matter
    descriptions   : true                                # enable front matter descriptions under content title?
    titleIcon      : true                                # enable front matter icon title prefix? default is false

    # content navigation
    navDesc        : true                                # include front matter descriptions in Prev/Next navigation cards
    navDescTrunc   : 30                                  # Number of characters by which to truncate the Prev/Next descriptions

    listDescTrunc  : 100                                 # Number of characters by which to truncate the list card description

    # Link behaviour
    intLinkTooltip : true                                # Enable a tooltip for internal links that displays info about the destination? default false
    # extLinkNewTab  : false                             # Open external links in a new Tab? default true
    # logoLinkURL: ""                                    # Set a custom URL destination for the top header logo link.

  flexsearch: # Parameters for FlexSearch
    enabled: true

menu:
  primary:
    - {name: Docs, url: /docs/, weight: 10}
    - {name: Features, url: /features/, weight: 20}
    - {name: About, url: /about/, weight: 30}
    - {name: Support, url: /support/, weight: 40}
  footer:
    - identifier: features
      name: Features
      url: '/features'
      weight: 10
    - name: 'Data Management'
      url: 'features/data_management'
      parent: features
    - name: 'Automated Pipelines'
      url: 'features/automated_pipelines'
      parent: features
    - name: 'Interactive Analysis'
      url: 'features/interactive_analysis'
      parent: features
    - name: 'Machine Learning'
      url: 'features/machine_learning'
      parent: features
    - identifier: docs
      name: Docs
      url: '/docs'
      weight: 20
    - name: 'Researchers'
      url: 'docs/researchers'
      parent: docs
    - name: 'Facilities'
      url: 'docs/facilities'
      parent: docs
    - name: 'Node Administration'
      url: 'docs/node-administraton'
      parent: docs
    - name: 'Deployment'
      url: 'docs/deployment'
      parent: docs
    - name: 'Development'
      url: 'docs/development'
      parent: docs
    - name: 'Operations'
      url: 'docs/operations'
      parent: docs
    - name: 'Architecture'
      url: 'docs/architecture'
      parent: docs
    - identifier: about
      name: About
      url: '/about'
      weight: 30
    - name: 'Mission'
      url: 'about/mission'
      parent: about
    - name: 'Federation'
      url: 'about/federation'
      parent: about
    - name: 'Compliance'
      url: 'about/compliance'
      parent: about
    - name: 'Funders'
      url: 'about/funders'
      parent: about
    - identifier: support
      name: Support
      url: '/support'
      weight: 40
    - name: 'Find Nodes'
      url: 'support/find_your_node'
      parent: support
    - name: 'Contact Us'
      url: 'support/contact_us'
      parent: support

taxonomies:
  category: Categories
  tag: Tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true
