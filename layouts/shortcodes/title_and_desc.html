<div class="text-center my-5 mx-auto ais-narrow">

  {{ with .Get "description" }}<p class="text-muted fs-5 mt-3">{{ . }}</p>{{ end }}
  {{ with .Get "link_text" }}<a href="{{ relLangURL "" }}" class="fw-semibold text-success">{{ . | safeHTML }}</a>{{ end }}
</div>
