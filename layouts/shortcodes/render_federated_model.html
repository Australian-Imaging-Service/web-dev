{{ with site.Params.about.section1 }}
<div class="row align-items-center g-5 my-4">
  <div class="col-lg-6">
    <h2 class="fw-bold mb-4">{{ .title }}</h2>
    {{ with resources.Get .image }}{{ with .Resize "1000x webp q90" }}
    <div class="ais-panel rounded-4 shadow p-4"><img src="{{ .RelPermalink }}" class="img-fluid" alt="Federated model" loading="lazy"></div>
    {{ end }}{{ end }}
  </div>
  <div class="col-lg-6">
    {{ range .description }}
    <h3 class="h4 fw-bolder ais-border-green ps-3 mt-4">{{ .title }}</h3>
    <p class="text-muted">{{ .description }}</p>
    {{ end }}
  </div>
</div>
{{ end }}
