{{ $sectionTitle := .Scratch.Get "sectionTitle" }}
{{ with (index .Site.Data.landing $sectionTitle) }}
{{ if .enable }}
<section id="{{ $sectionTitle }}" class="ais-section ais-section-alt">
  <div class="container">
    <div class="text-center mb-4 pb-1"><h2 class="fw-bold text-primary">{{ .title }}</h2></div>
    <div class="row g-4">
      {{ range .items }}
      <div class="col-md-4">
        <div class="card h-100 border-0 shadow-sm rounded-3 p-4">
          <h3 class="h4 fw-bolder ais-border-{{ .accent | default "blue" }} ps-3 mb-3">{{ .title }}</h3>
          <p class="text-muted mb-0">{{ .description }}</p>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
{{ end }}
